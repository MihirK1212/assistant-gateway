[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-gateway"
version = "0.1.0"
description = "Assistant gateway for orchestrating AI agents with FastAPI and Celery"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.3",
    "claude-agent-sdk>=0.2",
    "fastapi>=0.100",
    "httpx>=0.27",
    "pydantic>=2",
    "redis>=5",
    "uvicorn[standard]>=0.20",
    "websockets>=12",
]

[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.28",
]

[project.scripts]
assistant-gateway = "assistant_gateway.runner.launcher:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
exclude = ["venv*"]

[tool.setuptools.package-data]
"assistant_gateway.runner" = ["samples.json"]
"assistant_gateway.examples.calculator_web_app.calculator_chat_gateway" = ["config.json"]
"assistant_gateway.examples.calculator_web_app.chat_store" = ["chats.json"]
"assistant_gateway.chat_orchestrator.chat.store.file_system" = ["chats.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
